plugins {
    id 'com.android.application'
}

android {
    namespace 'local.weighttable'
    compileSdk 35

    defaultConfig {
        // New package ID avoids install failure when an older app with the same
        // package name was signed with a different key.
        applicationId "local.dashapp.gym.table"
        minSdk 23
        targetSdk 35
        versionCode 25
        versionName '1.25'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
